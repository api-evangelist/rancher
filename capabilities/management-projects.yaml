naftiko: 1.0.0-alpha2
info:
  label: Rancher Management API — Projects
  description: 'Rancher Management API — Projects. 2 operations. Lead operation: List projects. Self-contained Naftiko capability
    covering one Rancher business surface.'
  tags:
  - Rancher
  - Projects
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    RANCHER_API_KEY: RANCHER_API_KEY
capability:
  consumes:
  - type: http
    namespace: management-projects
    baseUri: https://{rancher_host}/v3
    description: Rancher Management API — Projects business capability. Self-contained, no shared references.
    resources:
    - name: projects
      path: /projects
      operations:
      - name: listprojects
        method: GET
        description: List projects
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createproject
        method: POST
        description: Create a project
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.RANCHER_API_KEY}}'
  exposes:
  - type: rest
    namespace: management-projects-rest
    port: 8080
    description: REST adapter for Rancher Management API — Projects. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/projects
      name: projects
      description: REST surface for projects.
      operations:
      - method: GET
        name: listprojects
        description: List projects
        call: management-projects.listprojects
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createproject
        description: Create a project
        call: management-projects.createproject
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: management-projects-mcp
    port: 9090
    transport: http
    description: MCP adapter for Rancher Management API — Projects. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-projects
      description: List projects
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: management-projects.listprojects
      outputParameters:
      - type: object
        mapping: $.
    - name: create-project
      description: Create a project
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: management-projects.createproject
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
