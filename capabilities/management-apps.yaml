naftiko: 1.0.0-alpha2
info:
  label: Rancher Management API — Apps
  description: 'Rancher Management API — Apps. 1 operations. Lead operation: List apps. Self-contained Naftiko capability
    covering one Rancher business surface.'
  tags:
  - Rancher
  - Apps
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    RANCHER_API_KEY: RANCHER_API_KEY
capability:
  consumes:
  - type: http
    namespace: management-apps
    baseUri: https://{rancher_host}/v3
    description: Rancher Management API — Apps business capability. Self-contained, no shared references.
    resources:
    - name: apps
      path: /apps
      operations:
      - name: listapps
        method: GET
        description: List apps
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.RANCHER_API_KEY}}'
  exposes:
  - type: rest
    namespace: management-apps-rest
    port: 8080
    description: REST adapter for Rancher Management API — Apps. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/apps
      name: apps
      description: REST surface for apps.
      operations:
      - method: GET
        name: listapps
        description: List apps
        call: management-apps.listapps
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: management-apps-mcp
    port: 9090
    transport: http
    description: MCP adapter for Rancher Management API — Apps. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-apps
      description: List apps
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: management-apps.listapps
      outputParameters:
      - type: object
        mapping: $.
