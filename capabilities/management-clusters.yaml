naftiko: 1.0.0-alpha2
info:
  label: Rancher Management API — Clusters
  description: 'Rancher Management API — Clusters. 4 operations. Lead operation: List clusters. Self-contained Naftiko capability
    covering one Rancher business surface.'
  tags:
  - Rancher
  - Clusters
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    RANCHER_API_KEY: RANCHER_API_KEY
capability:
  consumes:
  - type: http
    namespace: management-clusters
    baseUri: https://{rancher_host}/v3
    description: Rancher Management API — Clusters business capability. Self-contained, no shared references.
    resources:
    - name: clusters
      path: /clusters
      operations:
      - name: listclusters
        method: GET
        description: List clusters
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createcluster
        method: POST
        description: Create a cluster
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: clusters-id
      path: /clusters/{id}
      operations:
      - name: getcluster
        method: GET
        description: Retrieve a cluster
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
      - name: deletecluster
        method: DELETE
        description: Delete a cluster
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.RANCHER_API_KEY}}'
  exposes:
  - type: rest
    namespace: management-clusters-rest
    port: 8080
    description: REST adapter for Rancher Management API — Clusters. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/clusters
      name: clusters
      description: REST surface for clusters.
      operations:
      - method: GET
        name: listclusters
        description: List clusters
        call: management-clusters.listclusters
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createcluster
        description: Create a cluster
        call: management-clusters.createcluster
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/clusters/{id}
      name: clusters-id
      description: REST surface for clusters-id.
      operations:
      - method: GET
        name: getcluster
        description: Retrieve a cluster
        call: management-clusters.getcluster
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletecluster
        description: Delete a cluster
        call: management-clusters.deletecluster
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: management-clusters-mcp
    port: 9090
    transport: http
    description: MCP adapter for Rancher Management API — Clusters. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-clusters
      description: List clusters
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: management-clusters.listclusters
      outputParameters:
      - type: object
        mapping: $.
    - name: create-cluster
      description: Create a cluster
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: management-clusters.createcluster
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: retrieve-cluster
      description: Retrieve a cluster
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: management-clusters.getcluster
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-cluster
      description: Delete a cluster
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: management-clusters.deletecluster
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
