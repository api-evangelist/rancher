naftiko: "1.0.0-alpha1"

info:
  label: "Rancher Management API"
  description: >-
    The Rancher Management API exposes Rancher's multi-cluster Kubernetes management
    capabilities as Kubernetes-style REST resources. Supports automation of cluster
    lifecycle, project and namespace management, user and access control, catalog
    and app management, and CI/CD integration.
  tags:
    - Cluster Management
    - Containers
    - Kubernetes
    - Multi-Cluster
    - Open Source
    - SUSE
  created: "2026-05-02"
  modified: "2026-05-02"

binds:
  - namespace: env
    keys:
      RANCHER_BEARER_TOKEN: RANCHER_BEARER_TOKEN
      RANCHER_HOST: RANCHER_HOST

capability:
  consumes:
    - type: http
      namespace: rancher
      baseUri: "https://{{RANCHER_HOST}}/v3"
      description: "Rancher v3 Management API."
      authentication:
        type: bearer
        token: "{{RANCHER_BEARER_TOKEN}}"
      resources:
        - name: clusters
          path: /clusters
          description: "Downstream Kubernetes clusters managed by Rancher."
          operations:
            - name: list-clusters
              method: GET
              description: "List all clusters managed by Rancher."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-cluster
              method: POST
              description: "Provision a new cluster."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  name: "{{tools.name}}"
                  description: "{{tools.description}}"
                  kubernetesVersion: "{{tools.kubernetesVersion}}"
                  provider: "{{tools.provider}}"

        - name: cluster
          path: /clusters/{id}
          description: "Single cluster resource."
          operations:
            - name: get-cluster
              method: GET
              description: "Retrieve a single cluster by ID."
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "Cluster identifier."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: delete-cluster
              method: DELETE
              description: "Remove a cluster from Rancher management."
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "Cluster identifier."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: projects
          path: /projects
          description: "Rancher projects grouping namespaces."
          operations:
            - name: list-projects
              method: GET
              description: "List all projects."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-project
              method: POST
              description: "Create a new project."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: nodes
          path: /nodes
          description: "Cluster nodes."
          operations:
            - name: list-nodes
              method: GET
              description: "List all nodes."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: users
          path: /users
          description: "Rancher users."
          operations:
            - name: list-users
              method: GET
              description: "List all users."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: tokens
          path: /tokens
          description: "API tokens."
          operations:
            - name: list-tokens
              method: GET
              description: "List all API tokens."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-token
              method: POST
              description: "Create a new API token."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: catalogs
          path: /catalogs
          description: "Helm chart catalogs."
          operations:
            - name: list-catalogs
              method: GET
              description: "List registered Helm catalogs."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: apps
          path: /apps
          description: "Deployed Helm applications."
          operations:
            - name: list-apps
              method: GET
              description: "List deployed apps."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: role-templates
          path: /roleTemplates
          description: "Role templates for RBAC."
          operations:
            - name: list-role-templates
              method: GET
              description: "List all role templates."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: rancher-rest
      resources:
        - path: /v1/clusters
          name: clusters
          description: "Kubernetes clusters."
          operations:
            - method: GET
              name: list-clusters
              description: "List all clusters."
            - method: POST
              name: create-cluster
              description: "Create a new cluster."

    - type: mcp
      port: 9100
      namespace: rancher-mcp
      transport: http
      tools:
        - name: list-clusters
          description: "List all Kubernetes clusters managed by Rancher."
          hints:
            readOnly: true
            openWorld: true
          call: "rancher.list-clusters"
          outputParameters:
            - type: object
              mapping: "$."
