naftiko: 1.0.0-alpha2
info:
  label: Rancher Management API — Roles
  description: 'Rancher Management API — Roles. 1 operations. Lead operation: List role templates. Self-contained Naftiko
    capability covering one Rancher business surface.'
  tags:
  - Rancher
  - Roles
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    RANCHER_API_KEY: RANCHER_API_KEY
capability:
  consumes:
  - type: http
    namespace: management-roles
    baseUri: https://{rancher_host}/v3
    description: Rancher Management API — Roles business capability. Self-contained, no shared references.
    resources:
    - name: roleTemplates
      path: /roleTemplates
      operations:
      - name: listroletemplates
        method: GET
        description: List role templates
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.RANCHER_API_KEY}}'
  exposes:
  - type: rest
    namespace: management-roles-rest
    port: 8080
    description: REST adapter for Rancher Management API — Roles. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/roletemplates
      name: roletemplates
      description: REST surface for roleTemplates.
      operations:
      - method: GET
        name: listroletemplates
        description: List role templates
        call: management-roles.listroletemplates
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: management-roles-mcp
    port: 9090
    transport: http
    description: MCP adapter for Rancher Management API — Roles. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-role-templates
      description: List role templates
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: management-roles.listroletemplates
      outputParameters:
      - type: object
        mapping: $.
